name: Android APK

# Builds PhotoCraft's Android APK (arm64-v8a) on a GitHub-hosted runner: the Rust library with
# cargo-ndk, then the APK with the Gradle wrapper in apps/photocraft-android/android. Nothing has
# to be installed on a PC: run it from the Actions tab (Run workflow) or push to the branches
# below, then download the APK from the run's Artifacts.
#
# The build is the documented one (apps/photocraft-android/build.sh): a plain
# `./gradlew assembleRelease` alone would package no native library.

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Android release build number: 0 for a plain build, or the next number so an installed copy accepts it as an update (android-v<version>-<n>)"
        type: string
        default: "0"
      profile:
        description: "Rust profile of the native library (dev builds faster; release is the one to install)"
        type: choice
        options:
          - release
          - dev
        default: release
      run_tests:
        description: "Run the Rust tests for the toolbar and the Android shell first"
        type: boolean
        default: true
  push:
    branches:
      - feature/bottom-mobile-toolbar
      - android-port
  pull_request:
    branches:
      - android-port
    types: [opened, synchronize, reopened]

# One build per branch: a newer push cancels the older run.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      # The NDK the build is documented against (r27).
      NDK_VERSION: "27.3.13750724"
      # build.sh reads these; a push (no inputs) builds a plain release.
      PROFILE: ${{ inputs.profile || 'release' }}
      RELEASE_BUILD: ${{ inputs.release_build || '0' }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Interface translations (storytold/craft-i18n at the pinned commit)
        run: |
          git clone --quiet https://github.com/storytold/craft-i18n.git ../craft-i18n
          git -C ../craft-i18n checkout --quiet "$(tr -d '[:space:]' < craft-i18n.rev)"
          git -C ../craft-i18n rev-parse --short HEAD

      - name: Rust with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Separate from the host lanes in ci.yml: this one is a cross build. Saved on this
          # branch too (the action only saves on the default branch by default), so repeated
          # builds of the feature branch reuse the compiled dependencies.
          key: android-arm64
          save-if: true
          # A failing run still saves the compiled dependencies: the next attempt starts warm.
          cache-on-failure: true

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK platform 35, build-tools 35, NDK r27
        # The runner image ships the SDK and cmdline-tools (ANDROID_HOME), so this only adds the
        # pieces the build needs. android-actions/setup-android is not used: it installs the
        # retired `tools` package and fails on current images ("Failed to find package 'tools'").
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"; fi
          echo "SDK $SDK; sdkmanager $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/ndk"

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting (rustfmt writes what it would change; the diff is a build artifact)
        run: |
          cargo fmt --all
          if ! git diff --quiet -- '*.rs'; then
            git diff -- '*.rs' > "$RUNNER_TEMP/rustfmt.diff"
            echo "rustfmt changed these files:" && git diff --stat -- '*.rs'
          fi

      - name: Rust tests (phone toolbar, Android shell, pen mapping)
        if: ${{ inputs.run_tests || github.event_name != 'workflow_dispatch' }}
        run: |
          cargo test -p photocraft-ui-egui --lib -- phone_toolbar
          cargo test -p photocraft-android -p photocraft-tablet

      - name: Build the native library and the APK
        run: |
          # build.sh and the Gradle wrapper are checked in without their executable bit (upstream
          # has them that way too), so a fresh Linux checkout can't run them directly.
          chmod +x apps/photocraft-android/build.sh apps/photocraft-android/android/gradlew
          apps/photocraft-android/build.sh
          ls -l target/android
          sha256sum target/android/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk-arm64-v8a
          path: target/android/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the rustfmt diff, when there is one
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: ${{ runner.temp }}/rustfmt.diff
          if-no-files-found: ignore
          retention-days: 7
